name: CoasterBench Site
on:
  push:
    branches: [eval]
    paths:
      - 'evals/**'
      - 'rust/coaster-site/**'
      - '.github/workflows/coasterbench-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Job level, so the guard on the Cloudflare step can read them: a step's own
    # env is not in scope for its `if`.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/coaster-site
      - name: Build site
        # --cf-images: a CI build has no local artifacts to downscale, so the
        # captures are resized at the edge instead of served whole.
        run: cargo run --release --manifest-path rust/coaster-site/Cargo.toml -- --cf-images
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: evals/site
      - id: deployment
        uses: actions/deploy-pages@v5
      # The same build also goes to Cloudflare Pages, which is where
      # coasterbench.wseaton.com is served from. Skipped, without failing, until
      # the two secrets exist.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: >
          npx --yes wrangler@4 pages deploy evals/site
          --project-name coasterbench --branch "${{ github.ref_name }}" --commit-dirty true
