[package]
name = "coaster-site"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Static site generator for CoasterBench eval runs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
askama = "0.16"
clap = { version = "4", features = ["derive"] }
# Only the formats the site actually touches: PNG in, PNG + ICO out.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
