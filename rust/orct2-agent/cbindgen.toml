language = "C"
include_guard = "ORCT2_AGENT_H"
autogen_warning = "/* Generated by cbindgen from rust/orct2-agent. Do not edit by hand. */"
cpp_compat = true

[export]
prefix = "Orct2"
# Types only referenced by host-function imports (Rust extern blocks) are not
# reachable from exported fns, so cbindgen needs them listed explicitly.
include = ["RideStats", "TrackBounds", "ParkStats", "StallDetail"]
