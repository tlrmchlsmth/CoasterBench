# openshell sandbox create --name <name> --from localhost/codex-arena \
#     --policy rust/coaster-bench/sandbox/codex-policy.yaml --provider codex-oauth -- sleep infinity
#
# The codex-oauth provider injects its own endpoint block, but its binary list is
# read-only and names only /usr/bin/codex, /usr/local/bin/codex and the npm
# package. The upgraded binary at /home/sandbox/bin/codex is therefore
# unattributed and needs codex_upgraded_inference below, or every inference call
# is denied.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /home/sandbox

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  coaster_game:
    name: coaster-game-mcp
    endpoints:
      - host: host.containers.internal
        port: 8791
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/codex
      - path: /usr/bin/codex
      - path: /home/sandbox/bin/codex

  codex_upgraded_inference:
    name: codex-upgraded-inference
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: auth.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: ab.chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /home/sandbox/bin/codex

  codex_openrouter_inference:
    name: codex-openrouter-inference
    endpoints:
      - host: openrouter.ai
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /home/sandbox/bin/codex
