[package]
name = "coaster-bench"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Orchestrates CoasterBench runs: game MCP server + sandboxed Claude Code per round"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10"
signal-hook = "0.4.4"
ureq = { version = "2", features = ["json"] }
